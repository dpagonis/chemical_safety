<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Aid Info</title>
    <link rel="stylesheet" href="../static/css/style.css"> <!-- Ensure the path is correct based on your structure -->
</head>
<body>
  <header class="page-header">
    <a href="/" title="Go to Home Page"> <!-- Link to home page -->
        <img src="static/img/chembio_horiz.png" alt="Chembio Horizontal Logo" class="logo">
    </a>
  </header>

  <h1>{{name}} — First Aid Information</h1> <!-- Update the page title for each specific page -->
  {% if chemical.name_difference %}
    <div style="background-color: #fff3cd; border: 2px solid #ffc107; padding: 10px; margin: 10px 0; border-radius: 5px;">
      <strong>⚠️ Note:</strong> Search term "<strong>{{ chemical.name }}</strong>" autocorrected to "<strong>{{ chemical.full_name }}</strong>"
    </div>
  {% endif %}

  <div>
    {% for key, value in result.items() %}
      <h2>{{ key }}</h2> <!-- Display the dictionary key as a header -->
      <ul>
        {% for item in value %}
          <li>{{ item }}</li> <!-- Display each string in the list as a list item -->
        {% endfor %}
      </ul>
    {% endfor %}
  </div>

</body>
</html>
